[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrproc"
version = "0.0.1"
description = "Simple 1D/2D Bruker NMR processing for students (a SpinWorks alternative)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "nmrglue"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
